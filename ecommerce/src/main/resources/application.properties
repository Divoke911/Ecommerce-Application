# ===== APP =====
spring.application.name=ecommerce
server.port=8080

# ===== MYSQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yourMySQLpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== REDIS =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=yourRedisPassword   <- uncomment if you set a password

# ===== MAIL (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youremail@gmail.com
spring.mail.password=your-gmail-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

## Things to change for your setup

# | Property | What to put |
# |---|---|
# | `spring.datasource.password` | Your MySQL root password |
# | `spring.datasource.url` | Change `ecommerce` if your DB name is different |
# | `spring.mail.username` | Your Gmail address |
# | `spring.mail.password` | Gmail **App Password** (not your Gmail login password) |
# | `spring.data.redis.password` | Uncomment only if you set a Redis password |

# ---

# ## About `ddl-auto=validate`

# Since you already created the DB manually, `validate` is the right setting. It means:
# - Spring will **check** that your entities match the DB tables on startup
# - It will **not** create or modify any tables
# - If something doesn't match — it throws an error telling you exactly what's wrong

# ---

# ## Gmail App Password (needed for OTP emails)

# Regular Gmail password won't work. You need an **App Password**:
# ```
# Google Account → Security
# → 2-Step Verification (must be ON)
# → App Passwords
# → Select app: Mail → Select device: Windows
# → Generate → copy the 16-character password